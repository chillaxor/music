<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>影视仓</title>
<style>
  :root{
    --bg:#0e0f13; --card:#1a1c22; --card2:#22252d; --line:#2c2f38;
    --txt:#e9eaee; --sub:#8b8f99; --accent:#F55E1A; --accent2:#ff7a3c;
    --ok:#37d67a; --bad:#ff5b5b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px;overscroll-behavior:none}
  /* 小窗播放中：底部留出空间，别让悬浮小播放器挡住页面底部内容 */
  body.mini-playing{padding-bottom:130px}
  /* VIP 官网链接解析：独立解析态，影视仓的顶栏/列表/详情/抽屉一律不显示 */
  body.vip-only .topbar,
  body.vip-only #histPanel,
  body.vip-only #chips,
  body.vip-only #status,
  body.vip-only #grid,
  body.vip-only #searchPage,
  body.vip-only #sheet,
  body.vip-only #srcDrawer{display:none!important}
  body.vip-only{background:radial-gradient(circle at 50% 32%,#1d202b,#0e0f13 70%);padding:0}
  #vipPanel{display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px}
  body.vip-only #vipPanel{display:flex}
  .vip-card{width:100%;max-width:420px;border:1px solid var(--line);border-radius:18px;
    background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
    padding:26px 22px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.45)}
  .vip-ico{width:56px;height:56px;margin:0 auto 16px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
    font-size:24px;line-height:56px;box-shadow:0 8px 24px rgba(245,94,26,.35)}
  /* 二期：片名手填 / 重搜 / 多候选点选 */
  .vip-row{display:flex;gap:8px;margin-top:14px}
  .vip-row input{flex:1;min-width:0;background:rgba(255,255,255,.08);color:#fff;
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;outline:none}
  .vip-row button,.vip-cands button{border-radius:10px;font-size:13px;cursor:pointer}
  .vip-row button{background:var(--accent);color:#fff;border:0;padding:10px 14px;white-space:nowrap}
  .vip-cands{display:flex;flex-direction:column;gap:8px;margin-top:14px;max-height:38vh;overflow-y:auto}
  .vip-cands button{background:rgba(255,255,255,.07);color:#fff;
    border:1px solid var(--line);padding:10px 12px;text-align:left}
  .vip-title{font-size:18px;font-weight:700;letter-spacing:.5px}
  .vip-url{margin-top:10px;font-size:12px;color:var(--sub);word-break:break-all;line-height:1.6}
  .vip-state{margin-top:18px;padding:12px 14px;border-radius:10px;background:rgba(255,255,255,.05);
    font-size:12.5px;color:var(--txt);word-break:break-all;line-height:1.6;min-height:20px}
  .vip-tip{margin-top:18px;font-size:11px;color:var(--sub);line-height:1.7}
  /* 顶栏 */
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
    padding:10px 12px;background:linear-gradient(180deg,#15171c,#101116);border-bottom:1px solid var(--line)}
  .topbar .musicswitch{flex:none;display:flex;align-items:center;gap:5px;height:38px;padding:0 13px;border-radius:10px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:13px;font-weight:700;cursor:pointer;
    border:1px solid rgba(255,255,255,.15);white-space:nowrap}
  .topbar .musicswitch:active{opacity:.85;transform:scale(.97)}
  /* 窄屏：顶栏一行放不下时逐级压缩，保证「全网/历史/配置」始终可见 */
  @media(max-width:420px){
    .topbar{gap:6px;padding:8px 9px}
    .topbar .musicswitch{padding:0 10px;gap:4px}
    .scope{padding:6px 8px;font-size:11.5px}
  }
  @media(max-width:360px){
    .topbar{gap:5px;padding:8px 7px}
    /* 顶栏音乐按钮已按需求去掉「音乐」二字，只留 🎵 图标（musicswitch 不再含文字） */
    .search{padding:5px 9px}
  }
  .srcDrawer .cur{font-weight:600;color:var(--accent);font-size:12px;margin-left:8px}
  /* min-width:0 必需：flex 项默认 min-width:auto（取内容最小宽度），
     搜索框里的 input 有默认 size 宽度（约 200px），不置 0 就永远不收缩，
     会把右边的「全网 / 🕘 / ☰」挤出屏幕（手机上表现为看不见） */
  .search{flex:1 1 0;min-width:0;display:flex;background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:6px 12px;align-items:center}
  .search input{flex:1 1 0;min-width:0;width:100%;background:none;border:0;color:var(--txt);font-size:14px;outline:none}
  .search .go{color:var(--accent);font-weight:700;padding:0 4px}
  .scope{flex:none;padding:6px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);
    color:var(--accent);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
  /* 爬虫源开关：关着=置灰（默认），开着=主题色 */
  .scope.off{color:var(--sub);font-weight:400}
  .iconbtn{width:38px;height:38px;border-radius:10px;background:var(--card);border:1px solid var(--line);
    color:var(--txt);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
  /* 分类 chips */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:10px 12px 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:6px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);
    color:var(--sub);font-size:13px;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
  /* 网格 */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 12px 24px}
  @media(min-width:560px){.grid{grid-template-columns:repeat(4,1fr)}}
  @media(min-width:760px){.grid{grid-template-columns:repeat(6,1fr)}}
  /* 全网搜索分组头：跨整行 */
  .grpHead{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:10px 2px 2px;
    border-bottom:1px dashed var(--line);margin-bottom:2px}
  .grpHead .gn{font-size:13px;font-weight:800;color:var(--accent2);flex:1;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grpHead .gc{font-size:11px;color:var(--sub);flex:none}
  .grpHead .go2{font-size:11px;color:var(--accent);cursor:pointer;flex:none;padding:2px 6px}
  .vcard2{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .08s,opacity .08s}
  .vcard2:active{transform:scale(0.96);opacity:0.8}
  .vcard2 .pic{width:100%;aspect-ratio:2/3;background:#2a2d35;object-fit:cover;display:block}
  .vcard2 .ph{width:100%;aspect-ratio:2/3;background:linear-gradient(135deg,#2a2d35,#34373f);
    display:flex;align-items:center;justify-content:center;color:#555;font-size:24px}
  .vcard2 .meta{padding:7px 9px}
  /* 搜索结果标题：去固定高度裁切，有多少字显示多少字（用户需求） */
  .vcard2 .nm{font-size:13.5px;line-height:1.32;color:var(--txt);font-weight:600;word-break:break-word}
  .vcard2 .yr{font-size:11px;color:var(--sub);margin-top:3px;white-space:normal;word-break:break-word;line-height:1.4}
  .vcard2 .rm{font-size:11.5px;color:var(--accent2);margin-top:2px;white-space:normal;word-break:break-word;line-height:1.4}
  /* 状态条 */
  .status{padding:8px 14px;color:var(--sub);font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .status .load{color:var(--accent2);flex:none}
  /* 详情 / 选集：整屏抽屉（不再半屏贴底），z-index 必须高于搜索页 55 */
  .sheet{position:fixed;inset:0;z-index:60;display:none}
  .sheet.show{display:block}
  .sheet .mask{position:absolute;inset:0;background:rgba(0,0,0,.6)}
  .sheet .panel{position:absolute;inset:0;background:var(--card);
    padding:16px 14px 24px;overflow-y:auto;animation:up .2s ease}
  @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  .sheet .phead{display:flex;gap:12px;margin-bottom:10px}
  .sheet .phead img{width:104px;height:150px;border-radius:10px;object-fit:cover;background:#2a2d35}
  .sheet .phead .ph{width:104px;height:150px;border-radius:10px;background:linear-gradient(135deg,#2a2d35,#34373f);
    display:flex;align-items:center;justify-content:center;color:#555;font-size:30px;flex:none}
  .sheet .ptit{font-size:18px;font-weight:800;line-height:1.35}
  .sheet .pinfo{font-size:12.5px;color:var(--sub);margin-top:5px;line-height:1.55}
  .sheet .pdesc{font-size:13px;color:#b8bcc6;margin-top:8px;line-height:1.65;max-height:110px;overflow:auto}
  .closeX{position:absolute;right:12px;top:10px;font-size:22px;color:var(--sub);cursor:pointer;padding:4px 8px;z-index:2}
  .srcTabs{display:flex;gap:8px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none}
  .srcTabs::-webkit-scrollbar{display:none}
  .srcTab{flex:none;padding:5px 12px;border-radius:8px;background:var(--card2);border:1px solid var(--line);
    color:var(--sub);font-size:12px;cursor:pointer;white-space:nowrap}
  .srcTab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .epblock{margin-top:10px}
  .epblock .from{font-size:13.5px;font-weight:700;margin:6px 0;color:var(--txt)}
  .epblock .from small{color:var(--sub);font-weight:400;font-size:11.5px;margin-left:6px}
  .eps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  @media(min-width:560px){.eps{grid-template-columns:repeat(5,1fr)}}
  /* 集按钮：去两行截断，有多少字显示多少字（用户需求） */
  .ep{padding:10px 4px;border-radius:8px;background:var(--card2);border:1px solid var(--line);
    text-align:center;font-size:13px;line-height:1.3;color:var(--txt);cursor:pointer;
    word-break:break-all;min-height:2.5em}
  .ep:active{background:var(--accent);color:#fff}
  /* 正在播放的这一集：主题色实底 + 白字 + 加粗，一眼能看到看到哪了 */
  .ep.on{background:var(--accent);color:#fff;font-weight:700;border-color:var(--accent)}
  /* 源管理抽屉 */
  .srcDrawer{position:fixed;inset:0;z-index:50;display:none}
  .srcDrawer.show{display:block}
  .srcDrawer .mask{position:absolute;inset:0;background:rgba(0,0,0,.6)}
  .srcDrawer .panel{position:absolute;left:0;top:0;bottom:0;width:84%;max-width:340px;background:var(--card);
    padding:16px;overflow-y:auto}
  .srcDrawer h3{margin:0 0 10px;font-size:16px}
  .srcItem{display:flex;align-items:center;gap:8px;padding:10px;background:var(--card2);
    border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
  .srcItem .nm{flex:1;font-size:13px;min-width:0;white-space:normal;word-break:break-word;line-height:1.4}
  .srcItem .del{color:var(--bad);cursor:pointer;padding:4px 8px;font-size:13px}
  .srcItem .use{color:var(--accent);cursor:pointer;padding:4px 8px;font-size:13px}
  .field{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:8px;
    color:var(--txt);padding:10px;font-size:13px;margin-bottom:8px;outline:none}
  .addbar{display:flex;gap:8px;margin-top:6px}
  .toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#000d;
    color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  /* ========== 全网搜索结果页：左列源 tab + 右侧结果 ========== */
  #searchPage{position:fixed;inset:0;z-index:55;background:var(--bg);display:none;flex-direction:column}
  #searchPage.show{display:flex}
  .sp-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--card)}
  .sp-back{flex:none;width:30px;height:30px;border-radius:8px;background:var(--card2);border:1px solid var(--line);
    color:var(--txt);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .sp-kw{flex:1;min-width:0;font-size:14px;font-weight:800;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sp-stat{flex:none;font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
  .sp-body{flex:1;display:flex;min-height:0}
  #srcTabs{width:118px;flex:none;overflow-y:auto;border-right:1px solid var(--line);background:var(--card2);padding-bottom:24px}
  .srcTab{padding:10px 8px 10px 11px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
  .srcTab .tn{font-size:12px;color:var(--sub);line-height:1.3;word-break:break-all;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .srcTab .tc{font-size:10px;color:var(--sub);margin-top:3px}
  .srcTab.active{background:var(--card)}
  .srcTab.active .tn{color:var(--accent);font-weight:800}
  .srcTab.active .tc{color:var(--accent2)}
  .srcTab.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
  #srcResults{flex:1;min-width:0;overflow-y:auto;padding:10px 10px 24px}
  /* 搜索结果网格：手机上 2 列，标题能显示全；宽屏逐步加列 */
  #srcResults .grid{grid-template-columns:repeat(2,1fr);padding:0;gap:10px}
  @media(min-width:560px){#srcResults .grid{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:760px){#srcResults .grid{grid-template-columns:repeat(4,1fr)}}
  .src-empty{color:var(--sub);font-size:13px;text-align:center;padding:60px 20px;line-height:1.9}
  /* ========== 搜索历史下拉：点顶部搜索输入框弹出最近 10 条 ========== */
  #histPanel{position:fixed;left:0;right:0;z-index:58;background:var(--card);
    border-bottom:1px solid var(--line);box-shadow:0 14px 28px rgba(0,0,0,.5);
    display:none;flex-direction:column;max-height:72%;overflow-y:auto}
  #histPanel.show{display:flex}
  .hist-hd{display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px 8px;font-size:11px;color:var(--sub)}
  .hist-clear{color:var(--bad);font-size:12px;cursor:pointer;padding:2px 6px}
  .hist-item{display:flex;align-items:center;gap:10px;padding:11px 14px;font-size:14px;
    color:var(--txt);cursor:pointer;border-top:1px solid var(--line)}
  .hist-item:active{background:var(--card2)}
  .hist-item .hi-ic{flex:none;color:var(--sub);font-size:13px}
  .hist-item .hi-w{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hist-item .hi-del{flex:none;color:var(--sub);font-size:14px;padding:2px 6px;cursor:pointer}
  .hist-item .hi-del:active{color:var(--bad)}
  .hist-empty{padding:26px 14px;text-align:center;color:var(--sub);font-size:13px}
</style>
</head>
<body>
  <div class="topbar">
    <div class="musicswitch" onclick="switchToMusic()" title="切到音乐播放页">🎵</div>
    <div class="search">
      <input id="kw" placeholder="搜电影 / 剧集 / 演员" onkeydown="if(event.key==='Enter')doSearch()" onfocus="showHistPanel()" onclick="showHistPanel()" onblur="setTimeout(hideHistPanel,180)">
      <span class="go" onclick="doSearch()">搜索</span>
    </div>
    <span class="scope" id="scopeBtn" onclick="toggleScope()">全网</span>
    <span class="scope off" id="spiderBtn" onclick="toggleSpider()" title="爬虫源搜索：默认关闭，打开后全网搜索会额外搜 jar 爬虫源（每个源有超时，会拖慢出结果）">🕷</span>
    <div class="iconbtn" onclick="openHistory()" title="播放历史">🕘</div>
    <div class="iconbtn" onclick="openSrcDrawer()">☰</div>
  </div>

  <!-- 搜索历史下拉：点顶部搜索输入框时弹出（最近 10 条） -->
  <div id="histPanel"></div>

  <div id="chips" class="chips"></div>
  <div id="status" class="status"><span id="stxt"></span><span id="sload" class="load"></span></div>
  <div id="grid" class="grid"></div>

  <!-- 全网搜索结果页：左列源 tab（只列有结果的源），右侧显示所选源的视频 -->
  <div id="searchPage">
    <div class="sp-head">
      <div class="sp-back" onclick="closeSearchPage()">‹</div>
      <div class="sp-kw" id="spKw"></div>
      <div class="sp-stat" id="spStat"></div>
    </div>
    <div class="sp-body">
      <div id="srcTabs"></div>
      <div id="srcResults"></div>
    </div>
  </div>

  <div id="sheet" class="sheet">
    <div class="mask" onclick="closeSheet()"></div>
    <div class="panel">
      <!-- 内嵌播放器占位：原生在详情页顶部 docking 一个播放器时，这里撑出等高的空白，
           让海报/标题/选集都落到播放器下方，不被挡住。高度由 __setInlineSpace 设置。 -->
      <div id="dPlayerSpace"></div>
      <div class="closeX" onclick="closeSheet()">✕</div>
      <div class="phead">
        <div id="dPic" class="ph">🎬</div>
        <div style="flex:1;min-width:0">
          <div id="dTit" class="ptit"></div>
          <div id="dInfo" class="pinfo"></div>
        </div>
      </div>
      <div id="dDesc" class="pdesc"></div>
      <div id="dEps"></div>
    </div>
  </div>

  <div id="srcDrawer" class="srcDrawer">
    <div class="mask" onclick="closeSrcDrawer()"></div>
    <div class="panel">
      <h3>影视仓接口源<span id="curSrc" class="cur"></span></h3>
      <div id="srcList"></div>
      <div style="margin-top:10px;border-top:1px solid var(--line);padding-top:12px">
        <input id="newName" class="field" placeholder="名称，如：盒子迷多仓">
        <input id="newUrl" class="field" placeholder="接口地址，如：https://盒子迷.top/禁止贩卖">
        <div class="addbar">
          <button class="btn" style="flex:1" onclick="addSrc()">添加接口</button>
          <button class="btn" style="background:var(--card2);color:var(--txt)" onclick="closeSrcDrawer()">完成</button>
        </div>
        <div style="color:var(--sub);font-size:11px;margin-top:8px;line-height:1.5">
          接口源即影视仓「订阅地址」，返回 sites 列表，可添加多个。<br>
          「全网」搜索会并发搜索所有订阅里的 CMS 直连站点 + jar 爬虫源（🕷 标记），
          结果按来源分组；XBPQ/AppGet 等 JS 框架源暂不支持。<br>
          分类浏览为单站模式，点上方站点 chip 切换。
        </div>
      </div>
    </div>
  </div>

  <!-- VIP 官网链接解析：独立态面板（body.vip-only 时才显示） -->
  <div id="vipPanel">
    <div class="vip-card">
      <div class="vip-ico">▶</div>
      <div class="vip-title">VIP 链接解析</div>
      <div class="vip-url" id="vipUrl"></div>
      <div class="vip-state" id="vipState">正在准备…</div>
      <div class="vip-row" id="vipTitleRow">
        <input id="vipTitleEt" type="text" placeholder="片名（识别不到时手填）" />
        <button id="vipRetryBtn" type="button">重搜</button>
      </div>
      <div class="vip-cands" id="vipCands"></div>
      <div class="vip-tip">解析接口在「设置 → VIP 链接解析」里自行填写。<br>影视仓的订阅与搜索不会加载。</div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

<script>
/* ============ 基础设施 ============ */
var STATE={
  sources:[],cur:0,          // 订阅源列表 / 当前源
  srcSites:[],               // 每个订阅源缓存的 sites（预加载，全网搜索用）

    p.then(function(v){ if(settled)return; settled=true; clearTimeout(t); res(v); },

function reloadList(){STATE.pg=1;STATE.wd="";STATE.groups=[];$('grid').innerHTML='';loadList();}

/* ============ 列表 / 搜索 ============ */
async function loadList(){
  if(STATE.loading)return; STATE.loading=true; $('sload').textContent='加载中…';
  var site=STATE.site, api=site.api, items=[];
  var spiderT=null;
  if(STATE.wd&&isSpiderSite(site)&&!deniedSpider(site.api)){
    // 本站就是爬虫源：搜索走 Spider 桥
    spiderT={ri:STATE.cur,si:STATE.siteIdx,name:site.name||site.key,api:site.api,
      ext:site.ext?(typeof site.ext==='string'?site.ext:JSON.stringify(site.ext)):'',
      jar:(STATE.srcJars&&STATE.srcJars[STATE.cur])||'',key:site.key||site.name};
    var st=await spiderSearch(spiderT,STATE.wd);
    if(st){try{items=JSON.parse(st).list||[];}catch(e){}}
  } else if(STATE.wd){
    var ru=await get(norm(api+(api.indexOf('?')>=0?'&':'?')+'ac=videolist&wd='+encodeURIComponent(STATE.wd)+'&pg='+STATE.pg));
    if(ru.ok){try{items=JSON.parse(ru.text).list||[];}catch(e){}}
  } else if(site.type===3){
    console.log('loadList: 站点',site.name,'是爬虫源，无搜索词时跳过');
    $('sload').textContent=''; STATE.loading=false; setState('该站点为爬虫源，请直接搜索（分类浏览暂不支持）'); return;
  } else {
    var u=api+(api.indexOf('?')>=0?'&':'?')+'ac=videolist'+(STATE.t?'&t='+STATE.t:'')+'&pg='+STATE.pg;
    var rl=await get(norm(u));
    if(rl.ok){try{items=JSON.parse(rl.text).list||[];}catch(e){}}
  }
  STATE.loading=false; $('sload').textContent='';
  // 剔除空条目：没有标题、或直连条目没有可播放 id 的，一律丢掉，只保留有数据的
  items = items.filter(function(v){
    var nm=(v.vod_name||'').toString().trim();
    if(!nm) return false;
    if(!v._spider && !(v.vod_id||'').toString().trim()) return false;
    return true;
  });
  if(spiderT&&items.length){items.forEach(function(v){v._spider=spiderT;});}
  // 最后一页不足一页量（<10）视为到底，停止自动加载更多
  STATE.noMoreHome = items.length < 10;
  if(STATE.pg===1){$('grid').innerHTML='';}
  if(!items.length){ console.log('loadList: 0 条 (site='+site.name+' wd='+STATE.wd+' t='+STATE.t+')'); if(STATE.pg===1) setState(STATE.wd?'没有匹配的搜索结果':'该分类暂无内容'); return; }
  console.log('loadList: '+items.length+' 条, 首条='+items[0].vod_name);
  items.forEach(function(v){$('grid').appendChild(card(v,STATE.siteIdx));});
  setState((STATE.wd?'搜索':'')+'共 '+items.length+' 条'+(STATE.pg>1?('（第'+STATE.pg+'页）'):''));
  // 「加载更多」按钮已移除：改为下滑接近底部自动加载（见 fillHomeIfNeeded / window scroll 监听）
  if(!STATE.wd || STATE.searchScope!=='all') setTimeout(fillHomeIfNeeded, 150);
}
var LOADING_HOME=false; // 主页翻页防并发：一次只拉一页，避免滚动/补满时叠发请求
/** 主页（非全网聚合结果页）下滑接近底部，或首屏没填满时，自动加载下一页；「加载更多」按钮已移除 */
function loadMore(){
  // 全网搜索结果在结果页里翻页（loadMoreSrc），主页更多按钮已移除；
  // 防御：万一主页处于全网聚合态，就打开结果页
  if(STATE.wd&&STATE.searchScope==='all'&&STATE.groups.length){openSearchPage();return;}
  if(LOADING_HOME||STATE.noMoreHome)return;
  LOADING_HOME=true;
  STATE.pg++;
  Promise.resolve(loadList()).then(function(){ LOADING_HOME=false; });
}
/** 若内容还没填满可视区（无滚动条 / 接近底部），继续拉下一页，直到填满或到底 */
function fillHomeIfNeeded(){
  if(STATE.loading||LOADING_HOME||STATE.noMoreHome)return;
  if(!STATE.site)return;
  if($('searchPage').classList.contains('show'))return; // 搜索结果页是另一层，主页此时不滚
  if($('sheet').classList.contains('show'))return;       // 详情弹层打开时背景不触发
  if($('srcDrawer').classList.contains('show'))return;
  if(STATE.wd&&STATE.searchScope==='all'&&STATE.groups.length)return; // 全网聚合态交给结果页
  var doc=document.documentElement, sc=window.scrollY||doc.scrollTop||0;
  var dh=doc.scrollHeight||0, wh=window.innerHeight||0;
  if(dh-sc-wh < 220) loadMore();
}
// 主页下滑无限加载：滑到接近底部自动拉取下一页（替代「加载更多」按钮）；passive 不挡滚动
window.addEventListener('scroll', function(){
  if(STATE.loading||LOADING_HOME||STATE.noMoreHome)return;
  if(!STATE.site)return;
  if($('searchPage').classList.contains('show'))return;
  if($('sheet').classList.contains('show'))return;
  if($('srcDrawer').classList.contains('show'))return;
  if(STATE.wd&&STATE.searchScope==='all'&&STATE.groups.length)return;
  var doc=document.documentElement, sc=window.scrollY||doc.scrollTop||0;
  var dh=doc.scrollHeight||0, wh=window.innerHeight||0;
  if(dh-sc-wh < 220) loadMore();
}, {passive:true});
function card(v,si){

/* ============ 全网搜索结果页（左源 tab + 右结果） ============ */

/** 按 STATE.groups 重建左列源 tab：只列有结果的源，保持当前选中有效 */

/** 渲染右侧：当前源的结果网格（不再有「加载更多」按钮，改为自动补满 + 下滑无限加载） */

/** 进入分组对应的站点（切到该源浏览） */
function enterGroupSite(g){

/** 跨源卡片点击：按结果所属源解析站点上下文再开详情 */

/** 搜索结果页翻页：只翻当前选中的这一个源；被自动补满 / 滚动监听调用，不再有按钮 */
async function loadMoreSrc(){
  var g=STATE.groups[SRC_TAB_IDX];
  if(!g||g.noMore||LOADING_MORE)return;
  LOADING_MORE=true; setLoad('加载中…');
  g.pg++;
  var sep=g.api.indexOf('?')>=0?'&':'?';

/** 自动补满：结果还没填满可视区（无滚动条/接近底部）就继续拉下一页，直到填满或到底；
 *  配合 #srcResults 滚动监听，实现「默认加载全部 + 下滑无限加载」，不再有「加载更多」按钮 */
function maybeAutoLoad(){

/* ============ 搜索历史：点输入框弹出最近 10 条 ============ */
/* 存储优先走原生 SharedPreferences 桥（和接口源列表同机制，比 file:// 下的
 * localStorage 稳），桥不可用（如桌面浏览器调试页面）时退回 localStorage。 */
var HIST_MAX=10;
var HIST_LS_KEY='gd_video_search_history';
function histBridge(){ return !!(window.Android&&Android.getSearchHistory&&Android.saveSearchHistory); }
function loadHist(){
  try{
    if(histBridge()){ var a=JSON.parse(Android.getSearchHistory()||'[]'); if(Array.isArray(a))return a; }
  }catch(e){}
  try{ var b=JSON.parse(localStorage.getItem(HIST_LS_KEY)||'[]'); if(Array.isArray(b))return b; }catch(e){}
  return [];
}
function persistHist(a){
  try{
    if(histBridge()){ Android.saveSearchHistory(JSON.stringify(a)); return; }
  }catch(e){}
  try{ localStorage.setItem(HIST_LS_KEY,JSON.stringify(a)); }catch(e){}
}
/** 记一条搜索历史：去重、置顶（最新的在最前）、最多 HIST_MAX 条 */
function saveHist(w){
  w=(w||'').trim(); if(!w)return;
  var a=loadHist().filter(function(x){return x!==w;});
  a.unshift(w); a=a.slice(0,HIST_MAX);
  persistHist(a);
}
function delHist(w){
  persistHist(loadHist().filter(function(x){return x!==w;}));
  renderHistPanel();
}
function clearHist(){
  persistHist([]);
  renderHistPanel();
  toast('已清空搜索记录');
}
function renderHistPanel(){
  var hp=$('histPanel'); if(!hp)return;
  var a=loadHist();
  if(!a.length){ hp.innerHTML='<div class="hist-empty">暂无搜索记录</div>'; return; }
  var h='<div class="hist-hd"><span>搜索记录</span><span class="hist-clear" onclick="clearHist()">清空</span></div>';
  a.forEach(function(w){
    h+='<div class="hist-item" data-w="'+esc(w)+'">'+
       '<span class="hi-ic">🕘</span><span class="hi-w">'+esc(w)+'</span>'+
       '<span class="hi-del">✕</span></div>';
  });
  hp.innerHTML=h;
  // 行点击 = 回填输入框并搜索；行尾 ✕ = 删这一条（stopPropagation 防止顺带触发搜索）
  Array.prototype.forEach.call(hp.querySelectorAll('.hist-item'),function(row){
    row.addEventListener('click',function(ev){
      if(ev.target&&ev.target.classList.contains('hi-del')){
        ev.stopPropagation();
        delHist(row.getAttribute('data-w'));
        return;
      }
      $('kw').value=row.getAttribute('data-w')||'';
      hideHistPanel();
      doSearch();
    });
  });
}
function showHistPanel(){
  var hp=$('histPanel'); if(!hp)return;
  renderHistPanel();
  // 面板贴顶栏下沿：顶栏高度随窄屏媒体查询变化，动态量而不是写死
  var bar=$('kw')&&$('kw').closest?$('kw').closest('.topbar'):null;
  hp.style.top=((bar||document.body).getBoundingClientRect().bottom)+'px';
  hp.classList.add('show');
}
function hideHistPanel(){ var hp=$('histPanel'); if(hp)hp.classList.remove('show'); }

/* ============ 搜索：全网聚合 / 单站 ============ */

/** 爬虫源（csp_ jar）搜索开关：默认关。开着搜得全但每个源都有超时，
 *  直连结果要等爬虫全超时/搜完才渲染，实测能拖几分钟，故默认关闭。 */
function toggleSpider(){

  paintSpiderBtn();

    ? '已开启爬虫源搜索：结果会更全，但出结果会变慢（可随时再点 🕷 关掉）'

function paintSpiderBtn(){

  b.textContent=STATE.spiderOn?'🕷 爬':'🕷';

/** 汇总所有订阅源里的 CMS 直连站点 [{si,name,api}] */
function collectDirectSites(){
  var out=[];
  (STATE.srcSites||[]).forEach(function(sites,ri){
    (sites||[]).forEach(function(s,si){ if(isDirect(s)) out.push({ri:ri,si:si,name:s.name||s.key||('站点'+(si+1)),api:s.api}); });
  });
  return out;
}
/** 汇总所有订阅源里的 jar 爬虫站点 [{ri,si,name,api,ext,jar,key}]
 *  站点自带 jar 优先：多仓里 47 个站点各自带 jar（指向 10 个不同 dex jar），
 *  旧逻辑一律用仓级 spider，导致 csp_Jpys 这类只在自带 jar 里的类永远找不到。 */
function collectSpiderSites(){
  var out=[];
  (STATE.srcSites||[]).forEach(function(sites,ri){
    var jar=(STATE.srcJars&&STATE.srcJars[ri])||'';
    (sites||[]).forEach(function(s,si){
      var ownJar=(s&&typeof s.jar==='string'&&s.jar)?s.jar:'';
      // SPIDER_DENY 原意是跳过没有 jar 的 JS 框架源；带自有 jar 的
      // XBPQ/AppGet 等其实是 DexClassLoader 爬虫，不该被误伤。
      if(s&&s.api&&String(s.api).indexOf('csp_')===0&&(!deniedSpider(s.api)||ownJar)){
        out.push({ri:ri,si:si,name:s.name||s.key||('站点'+(si+1)),api:s.api,
          ext:s.ext?(typeof s.ext==='string'?s.ext:JSON.stringify(s.ext)):'',
          jar:ownJar||jar,key:s.key||s.name||('site'+ri+'_'+si)});
      }
    });
  });
  return out;
}
/** 全网爬虫源搜索：并发搜所有 csp_ 站点，结果按来源分组（🕷 标记） */
async function searchSpiderAll(w){
  var empty={sites:0,items:0};
  if(!w)return empty;
  var targets=collectSpiderSites();
  if(!targets.length)return empty;
  var done=0,hit=0,cnt=0,autoSwitched=false;
  var queue=targets.slice();
  var CONC=6;
  async function worker(){
    while(queue.length){
      var t=queue.shift();
      var txt=await spiderSearch(t,w);
      var items=[];
      if(txt){try{items=JSON.parse(txt).list||[];}catch(e){}}
      if(items.length){
        items.forEach(function(v){v._spider=t;});
        STATE.groups.push({ri:t.ri,si:t.si,name:t.name,api:t.api,spider:true,items:items,pg:1,noMore:true});
        hit++;cnt+=items.length;
        // 旧逻辑只在 SRC_TAB_IDX===groups.length-1 时重绘，而直连阶段已把
        // SRC_TAB_IDX 锁成 0，条件恒 false：结果只进左 tab、右侧永远停在第一个
        // 直连源，用户等一分钟也看不到影视仓那批源。这里首个爬虫结果到达就
        // 切过去重绘；之后只增 tab 不重画，避免打断用户滚动。
        var draw=false;
        if(!SRC_TAB_USER_PICKED && !autoSwitched){
          SRC_TAB_IDX=STATE.groups.length-1; autoSwitched=true; draw=true;
        }
        refreshSrcTabs(); // 有结果的爬虫源实时出现在左侧 tab
        if(draw) renderSrcResults();
      }
      done++;
      setState('正在搜索爬虫源… '+done+'/'+targets.length+'（'+hit+' 个源有结果）');
    }
  }
  var ws=[];for(var i=0;i<Math.min(CONC,targets.length);i++)ws.push(worker());
  await Promise.all(ws);
  console.log('searchSpiderAll done: '+hit+'/'+targets.length+' 个源有结果 · 共 '+cnt+' 条');
  return {sites:hit,items:cnt};
}
async function searchAll(w){
  var targets=collectDirectSites();
  if(!targets.length && !collectSpiderSites().length){
    // 一个直连站、一个爬虫源都没有：退回当前源搜索（可能是单源没预加载成功）
    STATE.wd=w;STATE.pg=1;$('grid').innerHTML='';renderClassChips();loadList();return;
  }
  STATE.wd=w; STATE.pg=1; STATE.groups=[]; SRC_TAB_USER_PICKED=false;
  renderClassChips();
  // 结果进新开的结果页（左源 tab + 右结果），主页浏览列表原样留在背后
  openSearchPage();
  setState('正在全网搜索 '+targets.length+' 个源…');
  setLoad('搜索中…');
  var done=0, hit=0, cnt=0;
  var queue=targets.slice();
  var CONC=6;
  async function worker(){
    while(queue.length){
      var t=queue.shift();
      var sep=t.api.indexOf('?')>=0?'&':'?';
      var u=t.api+sep+'ac=videolist&wd='+encodeURIComponent(STATE.wd)+'&pg=1';
      var r=await get(norm(u));
      var items=[];
      if(r.ok){try{items=JSON.parse(r.text).list||[];}catch(e){}}
      if(items.length){
        items.forEach(function(v){v._ri=t.ri;v._si=t.si;});
        STATE.groups.push({ri:t.ri,si:t.si,name:t.name,api:t.api,items:items,pg:1});
        hit++; cnt+=items.length;
        refreshSrcTabs(); // 有结果的源实时出现在左侧 tab
      }
      done++;
      setState('正在全网搜索… '+done+'/'+targets.length+'（'+hit+' 个源有结果）');
    }
  }
  var ws=[]; for(var i=0;i<Math.min(CONC,targets.length);i++) ws.push(worker());
  await Promise.all(ws);
  setLoad('');
  // 直连结果立刻渲染（不再等爬虫源——那批每个都有超时，等着能把出结果拖几分钟）
  refreshSrcTabs(); renderSrcResults();
  setState(STATE.groups.length
    ? ('全网搜索：直连 '+hit+'/'+targets.length+' · 共 '+cnt+' 条')
    : ('直连源无结果（已搜 '+targets.length+' 个）'));
  if(!STATE.spiderOn){
    // 爬虫源关着时明确告知，否则用户只看到几个采集站，会以为「搜不出影视仓那批源」
    setLoad('只搜了直连站 · 点顶栏 🕷 可加搜 '+collectSpiderSites().length+' 个爬虫源');
  }
  // 爬虫源默认关闭；用户手动开了才后台搜，结果陆续进左侧 tab（不卡前台）
  if(STATE.spiderOn){
    var spiderTotal=collectSpiderSites().length;
    setState('直连 '+cnt+' 条到手 · 正在后台搜 '+spiderTotal+' 个爬虫源…');
    searchSpiderAll(STATE.wd).then(function(sp){
      // 收尾保险：整轮没自动切过、用户也没手点过时，落到第一个有结果的爬虫组
      if(!SRC_TAB_USER_PICKED && sp.sites>0){
        var cur=STATE.groups[SRC_TAB_IDX];
        if(!cur||!cur.spider){
          var firstSp=STATE.groups.findIndex(function(g){return g.spider&&g.items.length;});
          if(firstSp>=0) SRC_TAB_IDX=firstSp;
        }
      }
      refreshSrcTabs(); renderSrcResults();
      console.log('searchAll done: 直连 '+hit+'/'+targets.length+' · 爬虫 '+sp.sites+'/'+spiderTotal+' · 共 '+(cnt+sp.items)+' 条');
      setState(STATE.groups.length
        ? ('全网搜索：直连 '+hit+'/'+targets.length+' + 爬虫 '+sp.sites+'/'+spiderTotal+' · 共 '+(cnt+sp.items)+' 条')
        : ('全网搜索无结果：已搜 '+targets.length+' 个直连 + '+spiderTotal+' 个爬虫'));
    });
  }
}
/** 全网搜索结果按来源分组渲染 */
function doSearch(){
  var w=$('kw').value.trim();
  // 订阅预加载是异步的，冷启动早期 STATE.sites 可能还没落地。旧逻辑一句
  // 「请先选接口源」直接 return，表现为点搜索毫无反应；改按 srcSites 判断。
  var srcReady=(STATE.srcSites||[]).some(function(x){return x&&x.length;});
  if((!STATE.sites||!STATE.sites.length)&&!srcReady){toast('接口还在加载，请稍候再搜');return;}
  if(!w){ // 清空搜索：全网模式刷新推荐流（进结果页），本站模式回推荐列表
    STATE.groups=[];
    if(STATE.searchScope==='all'){
      var t=collectDirectSites();
      if(t.length){SRC_TAB_IDX=-1;searchAll('');return;} // 空词不回列表，直接刷新推荐
    }
    STATE.wd="";closeSearchPage();reloadList();return;
  }
  saveHist(w);          // 记一条搜索历史（去重、置顶、最多 10 条）
  hideHistPanel();
  if(STATE.searchScope==='all'){SRC_TAB_IDX=-1;searchAll(w);}
  else { closeSearchPage(); STATE.wd=w;STATE.pg=1;STATE.groups=[];$('grid').innerHTML='';renderClassChips();loadList(); }
}

/** 用指定站点打开详情：全网搜索结果是跨源的，必须带结果所属站的 api，不能沿用当前站 */

/** 爬虫源详情：走 Spider 桥拿标准 CatVod 详情 JSON */

/** 详情渲染（直连站与爬虫源共用） */
function renderDetail(v,site,spiderT){
  STATE.detail=v;
  STATE.detailSite=site;       // 直连站：播放时取 origin 当 Referer
  STATE.detailSpider=spiderT;  // 爬虫站：播放走 playerContent 解析
  var pic=v.vod_pic||"";
  $('dPic').innerHTML = pic?'<img src="'+esc(pic)+'" onerror="this.style.display=\'none\'">':'<div class="ph">🎬</div>';
  $('dTit').textContent=v.vod_name||'';
  $('dInfo').innerHTML=(v.vod_year?v.vod_year+' · ':'')+(v.vod_area?v.vod_area+' · ':'')+
    (v.vod_actor?('演员：'+esc(v.vod_actor).slice(0,40)):'')+
    ' <span style="color:var(--accent2)">▣ '+esc((site&&(site.name||site.key))||(spiderT&&spiderT.name)||'')+'</span>';
  $('dDesc').textContent=(v.vod_content||'').replace(/<[^>]+>/g,' ').trim();
  renderEps(v);
  console.log('renderDetail:',v.vod_name,'| 线路',parsePlay(v).length,'组'+(spiderT?'（爬虫源）':''));
  $('sheet').classList.add('show');
  setState('');
  // 进入详情自动起播第一集（内嵌在详情页顶部，竖屏继续浏览选集）。
  // 仅 AUTO_PLAY 为真时触发一次：打开一个新详情会置 true，恢复页面/重画则置 false。
  if(AUTO_PLAY){
    AUTO_PLAY=false;
    var g0=parsePlay(v);
    if(g0.length && g0[0].eps.length){ playEp(g0[0].from, g0[0].eps, 0); }
  }
}
function parsePlay(v){
  // MacCMS 标准：vod_play_from 与 vod_play_url 都用 $$$ 分隔线路；
  // 少数旧站用逗号，做个兼容回退
  var fromRaw=v.vod_play_from||'';
  var froms=fromRaw.indexOf('$$$')>=0?fromRaw.split('$$$'):fromRaw.split(',');
  var segs=(v.vod_play_url||'').split('$$$');
  var res=[];
  for(var i=0;i<segs.length;i++){
    var fn=froms[i]||('线路'+(i+1));
    var eps=[];
    segs[i].split('#').forEach(function(e){
      if(!e)return;
      var k=e.lastIndexOf('$');
      var name=(k>0?e.slice(0,k):e).trim();
      var url=(k>0?e.slice(k+1):e).trim();
      if(!url)return;
      eps.push({name:name,url:url});
    });
    if(eps.length) res.push({from:fn,eps:eps});
  }
  return res;
}
function renderEps(v){
  var box=$('dEps'); box.innerHTML='';
  var groups=parsePlay(v);
  if(!groups.length){box.innerHTML='<div style="color:var(--sub);padding:12px">该资源没有可播放的集数（可能是需解析的站点）</div>';return;}
  // 正在播放的集：同一部片子（vod_id 相同）+ 同线路 + 同下标才高亮，避免串台
  function isPlaying(from,ei){
    return STATE.playVodId && STATE.playVodId===(v.vod_id||'') &&
           STATE.playFrom===from && STATE.playIdx===ei;
  }
  function mkEp(g,e,ei){
    var b=document.createElement('div'); b.className='ep'+(isPlaying(g.from,ei)?' on':'');
    b.textContent=e.name;
    b.title=e.name;
    b.onclick=function(){playEp(g.from,g.eps,ei);};
    return b;
  }
  // 单线路：直接显示该线路的选集
  if(groups.length===1){
    var g0=groups[0]; var ep0=document.createElement('div'); ep0.className='eps';
    g0.eps.forEach(function(e,ei){ ep0.appendChild(mkEp(g0,e,ei)); });
    box.appendChild(ep0); return;
  }
  // 多线路：用 Tab 分隔（横向滚动），点击切换线路，下方只展示当前线路的选集。
  // 不再用「线路1/线路2…」堆成列表逐条展开，避免详情过长、要点好几次才看到想看的线路。
  var tabs=document.createElement('div'); tabs.className='srcTabs'; tabs.style.padding='6px 0 10px';
  var grid=document.createElement('div'); grid.className='eps'; grid.id='epsGrid';
  function select(gi){
    tabs.querySelectorAll('.srcTab').forEach(function(t,i){t.classList.toggle('on',i===gi);});
    var g=groups[gi]; grid.innerHTML='';
    g.eps.forEach(function(e,ei){ grid.appendChild(mkEp(g,e,ei)); });
  }
  groups.forEach(function(g,gi){
    var t=document.createElement('div'); t.className='srcTab'+(gi===0?' on':'');
    t.textContent=g.from+' ('+g.eps.length+')';
    t.onclick=function(){select(gi);};
    tabs.appendChild(t);
  });
  box.appendChild(tabs); box.appendChild(grid);
  select(0);
}
/**
 * 点选集起播。from=线路名，eps=该线路全部剧集，idx=起始集下标。
 * 同时把整条剧集列表交给原生播放器，支持上一集/下一集/播完自动连播；
 * 爬虫源列表原生侧只存元数据，切集时回传 __playSpiderAt 重新解析。
 */
function playEp(from,eps,idx){
  // 注意：不再在这里 closeSheet()。详情页留在 WebView 里（被全屏播放器盖住），
  // 这样播放中按返回关掉播放器后，能回到「播放前那个视频的详情/选集页」，而不是列表或主页。
  var spiderT=STATE.detailSpider;
  STATE.playFrom=from; STATE.playEps=eps; STATE.playIdx=idx;
  STATE.playVodId=(STATE.detail&&STATE.detail.vod_id)||''; // 记下正在播的片子，供选集高亮
  if(STATE.detail) renderEps(STATE.detail); // 重画选集，把「正在播放」高亮移到新点的集
  var epsJson=JSON.stringify(eps.map(function(x){
    return {name:x.name,url:x.url,spider:!!spiderT};
  }));
  var spJson=spiderT?JSON.stringify({
    jar:spiderT.jar,api:spiderT.api,ext:spiderT.ext,key:spiderT.key,flag:from
  }):'';
  STATE.playEpsJson=epsJson; STATE.playSpJson=spJson;
  var e=eps[idx]||{};
  // 历史记录元数据：key 决定同一条记录去重更新，vodId/siteApi/from 供续播重新拉详情
  var meta=playMeta(e);
  // 爬虫源：先经 playerContent 解析出直链再交原生播放器
  if(spiderT){ playSpiderEp(spiderT,from,e,idx,epsJson,spJson,meta); return; }
  var url=e.url, name=(STATE.detail.vod_name||'')+' · '+from+' · '+e.name;
  // 很多 CDN 校验 Referer：带上详情所属站点的 origin，否则 403
  var ref='';
  try{ if(STATE.detailSite&&STATE.detailSite.api) ref=new URL(STATE.detailSite.api).origin; }catch(err){}
  // 直链媒体直接播；否则（/share/<hash> 等播放页）先嗅探抠直链再播
  (async function(){
    var finalUrl=url;
    if(url && !isDirectMedia(url)){
      toast('正在解析播放地址…');
      var j=await sniff(url, ref);
      console.log('SNIFF direct['+(STATE.detailSite&&STATE.detailSite.name||'')+'] '+url+' => '+(j&&j.ok?j.url:('fail:'+(j&&j.msg))));
      if(j&&j.ok&&j.url) finalUrl=j.url;
      else { toast('该线路解析失败，可换其他线路/源'); return; }
      // 起播这集的真实直链回填进剧集列表：原生切走再切回来时不用重复嗅探
      eps[idx].url=finalUrl;
      epsJson=JSON.stringify(eps.map(function(x){
        return {name:x.name,url:x.url,spider:!!spiderT};
      }));
      STATE.playEps=eps; STATE.playEpsJson=epsJson;
    }
    if(window.Android&&Android.playVideo) Android.playVideo(finalUrl,name,ref,epsJson,idx,spJson,meta);
    else toast('当前环境不支持播放');
  })();
}
/** 起播时的历史记录元数据（与当前详情上下文绑定） */
function playMeta(e){
  var t=STATE.detailSpider;
  return JSON.stringify({
    key:(t?('s:'+(t.key||t.api)):('d:'+((STATE.detailSite&&STATE.detailSite.api)||'')))+'|'+
       ((STATE.detail&&STATE.detail.vod_id)||'')+'|'+(e&&e.name||''),
    pic:(STATE.detail&&STATE.detail.vod_pic)||'',
    epName:(e&&e.name)||'',
    vodId:(STATE.detail&&STATE.detail.vod_id)||'',
    siteApi:(STATE.detailSite&&STATE.detailSite.api)||'',
    from:STATE.playFrom||''
  });
}
/* ============ 影视仓 parses 解析通道 ============
 * playerContent 返回 parse:1 时给的是 iframe 播放页，不是直链。影视仓靠订阅
 * parses（在线解析接口）+ WebView 嗅探 + rules 点击脚本把播放页变成 m3u8；
 * 旧实现只做一次静态 GET + 4 条正则，iframe 页里根本没有直链，必然失败。 */
function cfgOf(t){
  var i=(t&&typeof t.ri==='number')?t.ri:STATE.cur;
  var c=STATE.srcCfg[i];
  if(!c){
    for(var k=0;k<STATE.srcCfg.length;k++){
      if(STATE.srcCfg[k]&&(STATE.srcCfg[k].parses||[]).length){c=STATE.srcCfg[k];break;}
    }
  }
  return c||{};
}
function mergeHeaders(a,b){
  var o={};
  function put(m){
    if(!m||typeof m!=='object')return;
    Object.keys(m).forEach(function(k){ if(m[k]!=null&&String(m[k]).trim()) o[k]=String(m[k]); });
  }
  put(a); put(b); return o;
}
/** 解析接口返回可能是 {url} / {data:{url}} / 纯文本里塞 m3u8 */
function pickStream(text){
  if(!text)return '';
  try{
    var j=JSON.parse(text), c=[j.url,j.playUrl,j.data&&j.data.url,j.data&&j.data.playUrl,j.result&&j.result.url];
    for(var i=0;i<c.length;i++){ if(c[i]&&typeof c[i]==='string'&&/^https?:/i.test(c[i]))return c[i]; }
  }catch(e){}
  var m=String(text).match(/https?:\/\/[^"'\s\\]+\.(?:m3u8|mp4|flv|mpd)[^"'\s\\]*/i);
  return m?m[0]:'';
}
/** 按播放页 host 取 rules 里的自动点击脚本（饭团/毛驴这类要 JS 点一下才出地址） */
function scriptsFor(t,url){
  var c=cfgOf(t), out=[];
  (c.rules||[]).forEach(function(r){
    var hs=r.hosts||[];
    if(hs.length&&!hs.some(function(h){return url.indexOf(String(h).replace(/\*/g,''))>=0;}))return;
    (r.script||[]).forEach(function(s){out.push(s);});
  });
  return out;
}
/** 分批并发尝试订阅里的 parses，拿到第一个直链就返回 {url,headers,by}。
 *  11-10 实测：12 个接口串行最坏 94191ms 且全失败（type0 每个 WebView 13s）。
 *  改为 HTTP 型优先 + 每批 3 个并发 + 命中即停，最坏约 3 批。 */
async function resolveViaParses(url,headers,t){
  var ps=cfgOf(t).parses||[];
  console.log('PARSEDBG parses='+ps.length+' url='+String(url).slice(0,120));
  var jobs=[];
  for(var i=0;i<ps.length;i++){
    var p=ps[i]; if(!p||!p.url||p.url==='Demo')continue;
    var type=parseInt(p.type,10); if(isNaN(type))type=1;
    if(type===3)continue; // 聚合占位，不是真接口
    jobs.push({i:i,p:p,type:type});
  }
  // 便宜的 HTTP 型先跑；命中时就不必再开离屏 WebView
  jobs.sort(function(a,b){return (a.type===0?1:0)-(b.type===0?1:0);});
  async function runOne(job){
    var p=job.p, nm=p.name||('parse'+job.i), s=Date.now();
    // 解析接口自身可能带中文域名/中文参数（欧歌解析、公众号装歌APP），过 norm 做 IDN + 百分号编码
    var full=norm(p.url+encodeURIComponent(url));
    var h=mergeHeaders(headers,p.ext&&p.ext.header);
    try{
      if(job.type===0){
        var w=await webSniff(full,h,scriptsFor(t,full));
        if(w&&w.ok&&w.url){
          console.log('PARSEDBG WebView 命中 '+nm+' ('+(Date.now()-s)+'ms) => '+w.url.slice(0,140));
          return {url:w.url,headers:h,by:nm};
        }
      }else{
        var r=await getEx(full,h);
        if(r&&r.ok){
          var u=pickStream(r.text);
          if(u){
            console.log('PARSEDBG 接口命中 '+nm+' ('+(Date.now()-s)+'ms) => '+u.slice(0,140));
            return {url:u,headers:h,by:nm};
          }
        }
      }
      console.log('PARSEDBG 未命中 '+nm+' ('+(Date.now()-s)+'ms)');
    }catch(e){ console.log('PARSEDBG 失败 '+nm+': '+e); }
    return null;
  }
  var BATCH=3;
  for(var s=0;s<jobs.length;s+=BATCH){
    var rs=await Promise.all(jobs.slice(s,s+BATCH).map(runOne));
    for(var k=0;k<rs.length;k++){ if(rs[k]&&rs[k].url)return rs[k]; }
  }
  return null;
}
/** parse:1 且 jx:0 的播放页自带解析能力（如骚火 https://hhjx.hhplayer.com/?url=加密串），
 *  影视仓直接加载/嗅探它；再套一层在线解析接口反而 12/12 失败（11-10 实测 94s）。
 *  直嗅 1.5s 就能拦到真实 m3u8，故作为 parse:1 的首选分支。 */
async function sniffPlayPage(url,headers,t){
  if(!(window.Android&&Android.webSniff))return null;

    var w=await webSniff(url,headers,scriptsFor(t,url));
    if(w&&w.ok&&w.url){
      console.log('SPIDERDBG 直嗅播放页命中 ('+(Date.now()-s)+'ms) => '+String(w.url).slice(0,140));
      return {url:w.url,headers:headers,by:'直嗅播放页'};
    }
    console.log('SPIDERDBG 直嗅播放页未命中 ('+(Date.now()-s)+'ms)');
  }catch(e){ console.log('SPIDERDBG 直嗅播放页异常 '+e); }

}
/** 爬虫源播放：playerContent 返回 {url,parse,header}，直链才交原生播放器。
 *  headers 可以是 Referer 字符串，也可以是完整请求头对象——后者走新桥全量透传。 */
function playResolved(url,name,headers,idx,epsJson,spJson,meta){
  var hj='', ref='';
  if(headers&&typeof headers==='object'){
    hj=JSON.stringify(headers);
    ref=headers.Referer||headers.referer||'';
  }else{
    ref=String(headers||''); hj=JSON.stringify(ref?{Referer:ref}:{});
  }
  if(window.Android&&Android.playResolvedEx) Android.playResolvedEx(url,name,hj,idx,epsJson,spJson,meta);
  else if(window.Android&&Android.playResolved) Android.playResolved(url,name,ref,idx,epsJson,spJson,meta);
  else if(window.Android&&Android.playVideo) Android.playVideo(url,name,ref,epsJson,idx,spJson,meta);

}
async function playSpiderEp(t,flag,e,idx,epsJson,spJson,meta){
  toast('正在解析播放地址…');
  var txt=await spiderPlay(t,flag,e.url);
  var j=null; try{j=JSON.parse(txt);}catch(err){}
  var tag=t.key||t.name||t.api;
  console.log('SPIDERDBG['+tag+'] resolve => '+(txt?String(txt).slice(0,220):'(empty/timeout)'));
  if(!j){toast('该线路解析失败，可换其他线路/源');return;}
  var url=j.url||j.playUrl||'';
  var parse=(j.parse===1||j.parse==='1');
  var headers={};
  // 有的 jar 给对象，有的给 JSON 字符串（骚火 SaoHuo 就是字符串），还有的直接给 Referer 纯串
  try{
    if(j.header&&typeof j.header==='object') headers=j.header;
    else if(j.header&&typeof j.header==='string'){
      try{ var _h=JSON.parse(j.header); headers=(_h&&typeof _h==='object')?_h:{Referer:j.header}; }
      catch(e1){ headers={Referer:j.header}; }
    }
  }catch(err){}
  var name=(STATE.detail&&STATE.detail.vod_name||'')+' · '+t.name+' · '+e.name;
  // 已是直链媒体 → 直接播（header 全量透传，Jpys 这类要 UA+Origin+Referer）
  if(url && !parse && isDirectMedia(url)){
    console.log('SPIDERDBG['+tag+'] DIRECT '+url.slice(0,140));
    playResolved(url,name,headers,idx,epsJson,spJson,meta);
    return;
  }
  if(url && /^https?:/i.test(url)){
    var finalUrl='', finalHeaders=headers;
    // 少数源标 parse:1 但给的本来就是 m3u8 接口（热播 AppRJ），别再瞎解析
    if(isDirectMedia(url)) finalUrl=url;
    // parse=1 分流：jx:0 表示播放页自带解析，影视仓直接嗅探它；
    // 11-10 实测骚火：直嗅 1.5s 出 m3u8，把它再套 13 个 parses 则 94s 全失败。
    if(parse && !finalUrl){
      var jx=parseInt(j.jx,10); if(isNaN(jx))jx=0;
      if(jx===0){
        var d=await sniffPlayPage(url,headers,t);
        if(d&&d.url){ finalUrl=d.url; finalHeaders=mergeHeaders(headers,d.headers); }
      }
      if(!finalUrl){
        var r=await resolveViaParses(url,headers,t);

      }
    }

    if(!finalUrl){
      var s=await sniff(url,headers);
      console.log('SPIDERDBG['+tag+'] SNIFF '+(s&&s.ok?('OK '+s.url.slice(0,140)):('fail:'+(s&&s.msg))));
      if(s&&s.ok&&s.url) finalUrl=s.url;
    }
    if(!finalUrl){ toast('该线路解析失败，可换其他线路/源'); return; }
    // 真实直链回填进剧集列表：原生切集再切回来不用重复解析
    e.url=finalUrl;
    try{
      var arr=JSON.parse(epsJson||'[]');
      if(arr[idx])arr[idx].url=finalUrl;
      epsJson=JSON.stringify(arr); STATE.playEpsJson=epsJson;
    }catch(err){}
    console.log('SPIDERDBG['+tag+'] FINAL '+finalUrl.slice(0,140));
    playResolved(finalUrl,name,finalHeaders,idx,epsJson,spJson,meta);
    return;
  }
  console.log('SPIDERDBG['+tag+'] NO_URL msg='+(j.msg||''));

}

 *  b64 是原生带过来的原始 url，页面上下文丢失（历史续播）时兜底用。
 *  解析成功回填 STATE.playEps/playEpsJson，之后再切回同一集不用重复嗅探。 */
window.__resolveDirectAt=function(i,b64){

/* ============ VIP 官网链接解析（阶段 3） ============
 * 官网播放页 → 用户配置的解析接口，两条路同时试：
 *   ① 接口型：HTTP GET 返回 JSON / 文本里直接带 m3u8；
 *   ② 页面型：离屏 WebView 真正渲染解析站播放页，拦截媒体请求拿直链。
 * 谁先命中用谁，命中即停；全失败交给原生按设置回退原网页。
 * 不复用 resolveViaParses：那边依赖订阅 srcCfg，12+ 个接口会拖到 90s 以上；
 * 这里只跑用户自己选的源，限制 6 条 / 每批 3 条，首选源由原生排在最前。
 */
/** 独立解析态面板：只显示官网地址与解析进度，不碰影视仓 DOM */
function vipPanelSet(url,state){
  try{
    var u=document.getElementById('vipUrl'), s=document.getElementById('vipState');
    if(u&&url)u.textContent=url;
    if(s&&state)s.textContent=state;
  }catch(e){}
}
/** 由 ?vip=1 或 onNewIntent 触发：切到独立解析态 */
window.enterVipOnly=function(){
  window.__VIP_ONLY__=true;
  try{ document.body.classList.add('vip-only'); }catch(e){}
  vipPanelSet('', '正在准备解析…');
  vipLog('vip_only 模式：影视仓订阅与列表已跳过');
};
function vipLog(m){
  console.log('VIPDBG '+m);
  try{ if(window.Android&&Android.vipLog)Android.vipLog(String(m)); }catch(e){}
  if(window.__VIP_ONLY__) vipPanelSet('', String(m));
}
/** 多个候选里取第一个非 null 的成功结果；全部失败才 resolve(null) */
function vipFirstHit(ps){
  return new Promise(function(res){
    var left=ps.length, done=false;
    if(!left){res(null);return;}
    ps.forEach(function(p){
      p.then(function(v){
        if(v&&!done){done=true;res(v);}
        if(--left===0&&!done)res(null);
      },function(){
        if(--left===0&&!done)res(null);
      });
    });
  });
}
window.__resolveVipAt=function(b64Url,b64Sources,b64Platform){
  var url='',list=[],platform='';
  try{url=decodeB64(b64Url||'');}catch(e){}
  try{list=JSON.parse(decodeB64(b64Sources||''))||[];}catch(e){list=[];}
  try{platform=decodeB64(b64Platform||'');}catch(e){}
  function fail(msg){
    vipLog('FAIL '+msg);
    vipPanelSet('', '解析失败：'+msg);
    if(window.Android&&Android.onVipFailed)Android.onVipFailed(msg);
  }
  if(!/^https?:/i.test(url)){ fail('链接不是有效的官网地址'); return; }
  if(!list.length){ fail('还没配置解析接口（设置 → VIP 链接解析 里自行填写）'); return; }
  vipPanelSet(url, '开始解析 · '+(platform||'官网')+' · '+list.length+' 个接口');
  vipLog('start platform='+platform+' sources='+list.length+' url='+url.slice(0,120));
  function srcHeaders(s){
    var h={'Referer':url};
    try{
      var j=JSON.parse(s.headers||'{}');
      Object.keys(j).forEach(function(k){ if(j[k]!=null&&String(j[k]).trim())h[k]=String(j[k]); });
    }catch(e){}
    return h;
  }
  function runOne(s){
    var v=s.encoded?encodeURIComponent(url):url;
    var full=norm(String(s.prefix||'')+v);
    var h=srcHeaders(s), nm=s.name||'解析源';
    vipLog('try '+nm+' => '+full.slice(0,150));
    var jobs=[];
    jobs.push(getEx(full,h).then(function(r){
      var u=(r&&r.ok)?pickStream(r.text):'';
      if(u){ vipLog('HIT-HTTP '+nm+' => '+u.slice(0,140)); return {url:u,headers:h,by:nm}; }
      return null;
    },function(){return null;}));
    jobs.push(webSniff(full,h,[]).then(function(w){
      if(w&&w.ok&&w.url){ vipLog('HIT-SNIFF '+nm+' => '+w.url.slice(0,140)); return {url:w.url,headers:h,by:nm}; }
      return null;
    },function(){return null;}));
    return vipFirstHit(jobs);

    for(var i=0;i<use.length;i+=BATCH){

          if(window.Android&&Android.playVipResult) Android.playVipResult(r.url,name,JSON.stringify(r.headers),eps,0);

      vipLog('batch '+(Math.floor(i/BATCH)+1)+' 未命中');
    }
    fail('所有解析接口都没有返回可播放地址');
  })();
};

/* ============ VIP 直连搜索（二期） ============
 * 与一期「解析站 iframe」完全不同：这里按片名查片源、取回真实播放列表，
 * 直接把 m3u8 交给 ExoPlayer，不渲染任何第三方页面。
 *
 * 片名来源分三级：快捷位名称 → 官网静态 og:title / title → 解析面板手填。
 * 脚本原本是在官网 DOM 里等标题稳定，独立态不加载官网页，所以改成静态抓取。
 * 联想/详情两条模板由使用者在设置页填写，代码里不含任何第三方接口地址。

var VIP_SITES='爱奇艺|腾讯视频|腾讯|优酷|芒果TV|芒果|哔哩哔哩|bilibili|B站|搜狐视频|搜狐|乐视视频|乐视|PPTV聚力|PPTV|1905电影网|1905|土豆网|土豆|风行网|风行|西瓜视频|咪咕视频|咪咕|AcFun';

/** 剥掉平台名、营销词与「第N集」后缀，取出能拿去搜的片名主体 */
function vipCleanTitle(t){
  t=String(t||'').replace(/[《》【】「」]/g,'')
    .replace(new RegExp('(?:^|[\\s\\-_：:|｜，,。·]+)(?:'+VIP_SITES+')(?=$|[\\s\\-_：:|｜，,。·]+)','gi'),' ')
    .replace(new RegExp('^(?:'+VIP_SITES+')+','i'),'')
    .replace(new RegExp('(?:[\\s\\-_：:|｜]+|^)(?:'+VIP_SITES+')$','i'),'')
    .replace(/在线观看|高清正版|免费观看|完整版|正片|预告|全集|高清视频|高清|正版|VIP|独播|HD|&|·/gi,' ');
  // 营销词统一换成空格（不是删掉），否则「_高清正版」会粘成片名的一部分
  var parts=t.split(/[-_\s（(|｜&·]/)
    .map(function(s){return s.replace(/第.+[集季部]/,'').trim();})
    .filter(Boolean);
  var onlySite=new RegExp('^(?:'+VIP_SITES+')$','i');
  var hit=null;
  for(var i=0;i<parts.length;i++){
    var p=parts[i];
    if(p.length>=2&&!onlySite.test(p)&&!/第\d{1,8}[集期话季]/.test(p)){hit=p;break;}
  }
  return hit||parts[0]||'';
}
function vipDecode(s){
  var mp={'&amp;':'&','&lt;':'<','&gt;':'>','&quot;':'"','&#39;':"'",'&nbsp;':' '};
  return String(s||'').replace(/&(?:#(\d+)|#x([0-9a-f]+)|amp|lt|gt|quot|#39|nbsp);/gi,
    function(m,d,h){
      if(d)return String.fromCharCode(parseInt(d,10));
      if(h)return String.fromCharCode(parseInt(h,16));
      return mp[m.toLowerCase()]||m;
    });
}
/** 静态 HTML 里的 og:title 是服务端直出的，比 SPA 的 document.title 可靠 */
function vipRawTitle(html){
  var h=String(html||'');
  var m=h.match(/<meta[^>]+(?:property|name)=["']og:title["'][^>]+content=["']([^"']+)["']/i)
      ||h.match(/<meta[^>]+content=["']([^"']+)["'][^>]+(?:property|name)=["']og:title["']/i)
      ||h.match(/<title[^>]*>([\s\S]*?)<\/title>/i);

}
function vipTitleFromHtml(html){ return vipCleanTitle(vipRawTitle(html)); }
/** 官网 URL / 片名里抠当前集数：?ep= / /p9.html / /ep33 / 第12集 */
function vipEpNum(url,title){

  if((m=u.match(/[?&](?:ep|episode|p|e|cur)=(\d{1,5})(?!\d)/i)))return parseInt(m[1],10);
  if((m=u.match(/\/p(\d{1,5})\.html/i)))return parseInt(m[1],10);
  if((m=u.match(/\/ep(\d{1,5})(?!\d)/i)))return parseInt(m[1],10);
  if((m=s.match(/第?\s*(\d{1,8})\s*[集期话]/)))return parseInt(m[1],10);

/** 采集接口的播放列表：三个美元符号分线路，# 分集，单个美元符号分名称与地址 */
function vipParseEps(pu){
  if(!pu)return [];

    var out=groups[g].split('#').map(function(s){

    }).filter(function(e){return /^https?:\/\//i.test(e.url);});
    if(out.length)return out;
  }
  return [];
}
/** 精确 > 前缀 > 包含 > 反向包含；单字片名不做反向包含，避免播错片 */
function vipRank(list,title){
  function sc(x){
    var n=String((x&&x.name)||'');
    if(n===title)return 4;
    if(n.indexOf(title)===0)return 3;
    if(n.indexOf(title)>=0)return 2;
    if(title.length>=2&&title.indexOf(n)>=0)return 1;
    return 0;
  }
  var a=list.slice().sort(function(x,y){return sc(y)-sc(x);});
  a.forEach(function(x){x._score=sc(x);});
  return a;
}
/** getEx 自带 25s 超时，直连串行要好几次请求，这里再套一层短超时 */
function vipGet(url,h,ms){
  return Promise.race([
    getEx(url,h||{}),
    new Promise(function(res){setTimeout(function(){res({ok:false,text:'',code:0});},ms||9000);})
  ]);
}
function vipJson(r){ try{return r&&r.ok?JSON.parse(r.text):null; }catch(e){return null;} }
function vipPanelTitle(t){ var e=document.getElementById('vipTitleEt'); if(e)e.value=t||''; }
function vipPanelCands(list,pick){
  var box=document.getElementById('vipCands');
  if(!box)return;
  box.innerHTML='';
  list.forEach(function(c){
    var b=document.createElement('button');
    b.type='button'; b.textContent=String(c.name||'未命名');
    b.onclick=function(){ box.innerHTML=''; pick(c); };
    box.appendChild(b);
  });
}

/** 直连失败：带着原生传来的 b64 参数直接回落到一期接口链，不重新编码 */
function vipDirectFallback(c,reason){
  if(c.done)return;
  c.done=true;
  vipLog('DIRECT 失败：'+reason+' → 回落解析接口');
  var arr=[]; try{arr=JSON.parse(decodeB64(c.bSrc||''))||[];}catch(e){}
  if(arr.length&&window.__resolveVipAt){
    vipPanelSet(c.url,'直连未命中，改试 '+arr.length+' 个解析接口…');
    window.__resolveVipAt(c.bUrl,c.bSrc,c.bPlat);
  }else if(window.Android&&Android.onVipFailed){
    vipPanelSet('', '直连未命中：'+reason);
    Android.onVipFailed('直连搜索未命中（'+reason+'），且未配置解析接口');
  }
}

/** 命中候选后取播放列表并起播；eps 全量回传，原生可上一集/下一集 */
async function vipDirectFinish(c,hit,title,detailMap){
  vipPanelSet(c.url,'命中「'+hit.name+'」，取播放列表…');
  vipLog('DIRECT hit='+hit.name+' id='+hit.id);
  var H={'User-Agent':VIP_UA,'Accept':'*/*'};
  var o=detailMap[String(hit.id)];
  if(!o){
    var dUrl=String(c.cfg.detail||'').replace('{ids}',encodeURIComponent(String(hit.id)));
    var dj=vipJson(await vipGet(dUrl,H,9000));
    if(dj&&dj.list&&dj.list.length)o=dj.list[0];
  }
  var eps=o?vipParseEps(o.vod_play_url):[];
  if(!eps.length){ vipDirectFallback(c,'没有取到播放地址'); return; }
  var num=vipEpNum(c.url,(c.rawTitle||'')+' '+title), idx=0;
  if(num>0){
    for(var i=0;i<eps.length;i++){
      var m=String(eps[i].name||'').match(/\d{1,8}/);
      if(m&&parseInt(m[0],10)===num){idx=i;break;}
    }
  }
  var epsJson=JSON.stringify(eps.map(function(e,i){
    return {name:e.name||('第'+(i+1)+'集'),url:e.url};
  }));
  var nm=String(hit.name)+' · '+(eps[idx].name||('第'+(idx+1)+'集'));
  vipLog('DIRECT FINAL '+eps[idx].url.slice(0,140)+' idx='+idx+' eps='+eps.length);
  // vipLog 会把面板刷成日志文本，成功提示要放在它后面，用户才看得到友好结果
  vipPanelSet(c.url,'✓ 命中「'+hit.name+'」共 '+eps.length+' 集，第 '+(idx+1)+' 集起播');
  if(window.Android&&Android.playVipResult){
    c.done=true;
    Android.playVipResult(eps[idx].url,nm,'{}',epsJson,idx);
  } else vipDirectFallback(c,'播放桥不可用');
}

async function vipDirectRun(c,title){
  c.done=false;
  var box=document.getElementById('vipCands'); if(box)box.innerHTML='';
  var H={'User-Agent':VIP_UA,'Accept':'*/*'};
  vipPanelSet(c.url,'「'+title+'」搜索片源…');
  vipLog('DIRECT search title='+title);
  var sBase=String(c.cfg.suggest||''), list=[];
  function fetchList(kw){
    return vipGet(sBase.replace('{title}',encodeURIComponent(kw)),H,9000)
      .then(function(r){
        var j=vipJson(r);
        return (j&&j.list)?j.list.filter(function(x){return x&&x.id&&x.name;}):[];
      },function(){return [];});
  }
  // 联想接口偶发空结果，重试一次；再用清洗后的关键词兜一次
  for(var a=0;a<2&&!list.length;a++){
    list=await fetchList(title);
    if(!list.length){vipLog('DIRECT suggest 空结果，重试 '+(a+1));await new Promise(function(r){setTimeout(r,500);});}
  }
  if(!list.length){
    var alt=vipCleanTitle(title);
    if(alt&&alt!==title&&alt.length>=2){vipLog('DIRECT 改用「'+alt+'」重搜');list=await fetchList(alt);}
  }
  if(!list.length){ vipDirectFallback(c,'片源未收录「'+title+'」'); return; }
  var cands=vipRank(list,title);
  vipLog('DIRECT candidates='+cands.length+' top='+cands[0].name+' score='+cands[0]._score);
  var hit=null, detailMap={};
  if(cands.length===1){ hit=cands[0]; }
  else{
    var ids=cands.slice(0,12).map(function(x){return x.id;}).join(',');
    var dUrl=String(c.cfg.detail||'').replace('{ids}',encodeURIComponent(ids));
    var dj=vipJson(await vipGet(dUrl,H,9000));
    if(dj&&dj.list)dj.list.forEach(function(x){detailMap[String(x.vod_id||x.id||'')]=x;});
    var num=vipEpNum(c.url,(c.rawTitle||'')+' '+title);
    if(num>0){
      var viable=cands.filter(function(x){
        var o=detailMap[String(x.id)];
        return o&&vipParseEps(o.vod_play_url).length>=num;
      });
      if(viable.length===1){hit=viable[0];vipLog('DIRECT 集数硬判定命中 '+hit.name);}
    }
    if(!hit&&cands[0]._score===4&&(cands.length<2||cands[1]._score<3))hit=cands[0];
    if(!hit){
      vipPanelSet(c.url,'搜到 '+cands.length+' 个结果，请点选要播放的');
      vipLog('DIRECT 多候选待用户点选');
      vipPanelCands(cands.slice(0,12),function(x){vipDirectFinish(c,x,title,detailMap);});
      return;
    }
  }
  vipDirectFinish(c,hit,title,detailMap);
}

/** 原生入口：五个参数都是 base64，其中 bUrl/bPlat/bSrc 原样留给一期回落复用 */
window.__resolveVipDirect=function(bUrl,bCfg,bLabel,bPlat,bSrc){
  var url='',cfg={},label='',platform='';
  try{url=decodeB64(bUrl||'');}catch(e){}
  try{cfg=JSON.parse(decodeB64(bCfg||''))||{};}catch(e){cfg={};}
  try{label=decodeB64(bLabel||'');}catch(e){}
  try{platform=decodeB64(bPlat||'');}catch(e){}
  // rawTitle 保留未清洗的原始标题（含「第N集」），清洗后的片名只用于搜索
  var c={url:url,cfg:cfg,platform:platform,bUrl:bUrl,bPlat:bPlat,bSrc:bSrc,
         done:false,rawTitle:label};
  window.__VIP_CTX__=c;
  var btn=document.getElementById('vipRetryBtn');
  if(btn&&!btn.__bound){
    btn.__bound=true;
    btn.onclick=function(){
      var e=document.getElementById('vipTitleEt');
      var t=vipCleanTitle(e?e.value:'');
      if(!t){vipPanelSet('', '先填片名再点「重搜」');return;}
      c.rawTitle=e?e.value:'';
      vipPanelTitle(t);
      vipDirectRun(c,t);
    };
  }
  vipPanelSet(url,'正在识别片名…');
  vipLog('DIRECT start platform='+platform+' label='+label+' url='+url.slice(0,110));
  (async function(){
    var t=vipCleanTitle(label);
    vipPanelTitle(t);
    if(!t){
      vipPanelSet(url,'读取官网标题…');
      vipLog('DIRECT 快捷位名称不含片名，改读官网静态标题');
      var r=await vipGet(url,{'User-Agent':VIP_UA,'Accept':'text/html'},9000);
      var raw=vipRawTitle(r&&r.text);
      c.rawTitle=(label||'')+' '+raw;
      t=vipCleanTitle(raw);
      vipPanelTitle(t);
    }
    if(!t){
      // 不直接判失败：独立态没有官网 DOM，标题抓不到时让人手填一次
      vipPanelSet(url,'识别不出片名，请在上面填片名后点「重搜」');
      vipLog('DIRECT 片名识别失败，等待手动输入');
      return;
    }
    vipLog('DIRECT title='+t);
    vipDirectRun(c,t);
  })();
};

/* ============ 启动 ============ */
async function boot(){
  // 官网链接解析是独立态：不加载任何影视仓订阅，也不拉首页列表
  if(/[?&]vip=1(?:&|$)/.test(location.search)){ window.enterVipOnly(); return; }
  loadSources();
  $('scopeBtn').textContent = STATE.searchScope==='all' ? '全网' : '本站';
  try{ STATE.spiderOn = localStorage.getItem('gd_video_spider')==='1'; }catch(e){}
  paintSpiderBtn();
  // 先渲染当前源（不等其他源），再后台预加载其余订阅供全网搜索
  selectSource();
  preloadAllSources().then(function(){
    var n=collectDirectSites().length;
    console.log('preloadAllSources done: 直连站',n,'个');
  });
}
boot();
